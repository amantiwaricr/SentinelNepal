[project]
name = "sentinelnepal-backend"
version = "0.1.0"
description = "SentinelNepal FastAPI backend"
requires-python = ">=3.12"
# Dependencies are pinned in requirements.txt / requirements-dev.txt.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# Preview mode only for rules selected by exact code: PLW1514 (unspecified file encoding),
# which keeps reports readable as UTF-8 on Windows, where the default encoding differs.
preview = true
explicit-preview-rules = true
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "PLW1514"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom; tests also use throwaway credentials.
"tests/**" = ["S101", "S105", "S106"]
# isinstance asserts narrow handler argument types for mypy; they are not input checks.
"app/core/errors.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]
# The shared ML package is installed in editable mode, which mypy cannot follow.
mypy_path = "../ml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a PostgreSQL database given by TEST_DATABASE_URL",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[[tool.mypy.overrides]]
# scikit-learn and joblib (used through sentinel_ml) ship no type information.
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true
