name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sentinelnepal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinelnepal_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway credentials for the CI service container only.
      TEST_DATABASE_URL: postgresql+psycopg://sentinel:ci-only-password@localhost:5432/sentinelnepal_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            ml/requirements.txt
      - run: pip install -r requirements-dev.txt && pip install -e ../ml
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Migrations match models
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: alembic upgrade head && alembic check
      - name: Tests (unit + PostgreSQL integration)
        run: pytest

  ml:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/requirements*.txt
      - name: Install TShark (for the real-capture tests)
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark
      - run: pip install -r requirements-dev.txt && pip install -e .
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Tests (synthetic fixtures only)
        run: pytest

  collector:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            collector/requirements-dev.txt
            ml/requirements.txt
      - name: Install TShark (for the real-capture tests)
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark
      - run: pip install -r requirements-dev.txt && pip install -e ../ml && pip install -e .
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Tests (synthetic packets and CSV rows only)
        run: pytest

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types match openapi.json
        run: npm run gen:api:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  audit:
    # Known-vulnerability check of pinned dependencies (PyPI advisories via pip-audit, npm
    # advisories via npm audit). Fails on any Python finding or on high/critical npm ones.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install pip-audit==2.10.1
      - name: pip-audit (backend and ml)
        run: |
          (cd backend && pip-audit -r requirements.txt -r requirements-dev.txt)
          (cd ml && pip-audit -r requirements.txt -r requirements-dev.txt)
          (cd collector && pip-audit -r requirements-dev.txt)
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: cp .env.example .env && docker compose --profile lab config --quiet
      - name: Build images (including the lab profile)
        run: docker compose --profile lab build
