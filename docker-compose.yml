# SentinelNepal development stack: PostgreSQL, a one-shot migration job, the API, and the
# frontend dev server.
#
# The "lab" profile adds an isolated monitoring lab (Phase 6): a server and a client on an
# internal network with no internet access, packet capture of the server's traffic, and the
# collector. It runs only when asked for:  docker compose --profile lab up -d --build
# See docs/lab-runbook.md. The nftables firewall helper (Phase 7) is not here.
#
# Usage:  cp .env.example .env  (edit the password)  then  docker compose up --build
name: sentinelnepal

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  LIVE_MODEL_PROFILE: ${LIVE_MODEL_PROFILE:-full_no_ttl}
  COLLECTOR_OFFLINE_SECONDS: ${COLLECTOR_OFFLINE_SECONDS:-30}
  # Trained models from ml/artifacts are mounted read-only (see volumes below).
  MODEL_ARTIFACTS_DIR: /models

x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Published on localhost only, so the database is not exposed to the network.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: *backend-build
    image: sentinelnepal-backend:dev
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: *backend-build
    image: sentinelnepal-backend:dev
    environment: *backend-env
    volumes:
      - ./ml/artifacts:/models:ro
      # Read by `app.cli register-model --reports-dir` for metrics and the alert threshold.
      - ./ml/reports:/model-reports:ro
      - uploads:/srv/backend/uploads
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- Isolated monitoring lab (profile "lab") ---------------------------------------------

  lab-server:
    profiles: ["lab"]
    build:
      context: .
      dockerfile: lab/server.Dockerfile
    image: sentinelnepal-lab-server:dev
    hostname: lab-server
    networks: [lab]
    restart: unless-stopped

  lab-client:
    profiles: ["lab"]
    build:
      context: .
      dockerfile: lab/client.Dockerfile
    image: sentinelnepal-lab-client:dev
    hostname: lab-client
    networks: [lab]
    depends_on: [lab-server]
    restart: unless-stopped

  capture:
    # dumpcap inside lab-server's network namespace: it sees exactly the server's traffic
    # and nothing else (no host or internet interfaces). It runs as an unprivileged user;
    # the only privilege is CAP_NET_RAW, through dumpcap's file capability. (That is why
    # no-new-privileges is not set here: it would block the file capability.)
    profiles: ["lab"]
    build: &collector-build
      context: .
      dockerfile: collector/Dockerfile
    image: sentinelnepal-collector:dev
    network_mode: "service:lab-server"
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    # 30-second files, at most 20 kept (dumpcap deletes the oldest); 512-byte snapshots keep
    # headers and drop most payload. -p: no promiscuous mode.
    command: >-
      dumpcap -q -p -i eth0 -f "ip or ip6" -s 512 -b duration:30 -b files:20
      -w /captures/lab.pcapng
    volumes:
      - captures:/captures
    depends_on: [lab-server]
    restart: unless-stopped

  collector:
    profiles: ["lab"]
    build: *collector-build
    image: sentinelnepal-collector:dev
    environment:
      # Created with: docker compose exec backend python -m app.cli create-collector --name lab-sensor
      COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:-}
      SENTINEL_API_URL: http://backend:8000/api/v1
      CAPTURE_DIR: /captures
      STATE_FILE: /tmp/sentinel-collector.state
    volumes:
      - captures:/captures:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      backend:
        condition: service_healthy
      capture:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: sentinelnepal-frontend:dev
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  # The lab network has no route out: lab traffic cannot reach the host, the internet or
  # the rest of the stack.
  lab:
    internal: true

volumes:
  db-data:
  uploads:
  captures:
